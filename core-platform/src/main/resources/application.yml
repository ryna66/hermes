spring:
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
auth:
  jwt-ttl: ${JWT_TTL:PT1H}
  otp-ttl: ${OTP_TTL:PT5M}
  otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}
workflow:
  university-response-deadline: ${UNIVERSITY_RESPONSE_DEADLINE:P7D}
storage:
  upload-dir: ${UPLOAD_DIR:./uploads}
